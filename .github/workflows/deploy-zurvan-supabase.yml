name: Deploy Zurvan Supabase Function
run-name: Deploy ${{ inputs.function_name }} to Zurvan (manual)

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: "Select exactly one approved function to deploy"
        required: true
        type: choice
        options:
          - admin-device-transfers
          - device-management
          - account-complete-registration
          - device-enroll-start
          - device-enroll-finish
          - health-check
          - zurvan-license-status
          - authenticated-device-enrollment
          - zurvan-desk-api

permissions:
  contents: read

concurrency:
  group: zurvan-supabase-production
  cancel-in-progress: false

jobs:
  deploy-function:
    name: Deploy selected Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: zurvan-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: yztithydgdvydaktuxlw
      FUNCTION_NAME: ${{ inputs.function_name }}
    steps:
      - name: Check required secret
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Create the SUPABASE_ACCESS_TOKEN Actions secret first."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check function is present
        shell: bash
        run: |
          if [[ ! -f "supabase/functions/$FUNCTION_NAME/index.ts" ]]; then
            echo "::error::Selected function source is missing."
            exit 1
          fi

      - name: Set up Supabase CLI
        # v3 resolves CLI releases through npm instead of relying on the
        # GitHub latest-release lookup, which can fail with 403 rate limits.
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Check Supabase CLI version
        run: supabase --version

      - name: Deploy selected function only
        shell: bash
        run: |
          supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --use-api

      - name: Verify deployed Zurvan Desk API
        if: inputs.function_name == 'zurvan-desk-api'
        shell: bash
        run: |
          set -euo pipefail
          url='https://yztithydgdvydaktuxlw.supabase.co/functions/v1/zurvan-desk-api/health'
          for attempt in 1 2 3 4 5 6; do
            output="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 --output "$output" --write-out '%{http_code}' -H 'apikey: sb_publishable_UAKFYbxgWOCVRDDdv_0JLg_oIIiubmT' "$url")"
            if [[ "$status" == '200' ]] && jq -e '.service == "zurvan-desk-api" and .status == "ok" and .apiVersion == "v1"' "$output" >/dev/null; then
              echo 'Zurvan Desk API is healthy and its database and private bucket are ready.'
              rm -f "$output"
              exit 0
            fi
            echo "::warning::Desk health probe attempt $attempt returned HTTP $status"
            if [[ "$attempt" == '6' ]]; then
              echo "::error::Desk health probe failed (HTTP $status). Response:"
              head -c 1600 "$output"
              echo
              rm -f "$output"
              exit 1
            fi
            rm -f "$output"
            sleep 3
          done

      - name: Deployment summary
        shell: bash
        run: |
          echo "### Deployment requested" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function: \`$FUNCTION_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Supabase project: \`$PROJECT_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- No SQL migration was applied." >> "$GITHUB_STEP_SUMMARY"
