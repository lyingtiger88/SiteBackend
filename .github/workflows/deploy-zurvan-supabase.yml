name: Deploy Zurvan Supabase Function
run-name: Deploy ${{ inputs.function_name }} to Zurvan (manual)

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: "Select exactly one approved function to deploy"
        required: true
        type: choice
        options:
          - admin-device-transfers
          - device-management
          - account-complete-registration
          - device-enroll-start
          - device-enroll-finish
          - health-check
          - zurvan-license-status
          - authenticated-device-enrollment
          - zurvan-celebration-schedules

permissions:
  contents: read

concurrency:
  group: zurvan-supabase-production
  cancel-in-progress: false

jobs:
  deploy-function:
    name: Deploy selected Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: zurvan-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: yztithydgdvydaktuxlw
      FUNCTION_NAME: ${{ inputs.function_name }}
    steps:
      - name: Check required secret
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Create the SUPABASE_ACCESS_TOKEN Actions secret first."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check function is present
        shell: bash
        run: |
          if [[ ! -f "supabase/functions/$FUNCTION_NAME/index.ts" ]]; then
            echo "::error::Selected function source is missing."
            exit 1
          fi

      - name: Set up Supabase CLI
        # v3 resolves CLI releases through npm instead of relying on the
        # GitHub latest-release lookup, which can fail with 403 rate limits.
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Check Supabase CLI version
        run: supabase --version

      - name: Deploy selected function only
        shell: bash
        run: |
          supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --use-api

      - name: Deployment summary
        shell: bash
        run: |
          echo "### Deployment requested" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function: \`$FUNCTION_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Supabase project: \`$PROJECT_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- No SQL migration was applied." >> "$GITHUB_STEP_SUMMARY"
