<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zurvan Admin | Device Transfers</title><style>
body{font:15px Tahoma,Arial;background:#f3f5f9;color:#182335;padding:24px}main{max-width:1000px;margin:auto;background:white;padding:24px;border-radius:16px}input,button,textarea{box-sizing:border-box;width:100%;padding:11px;margin:7px 0 14px;font:inherit;border:1px solid #c7cfdb;border-radius:8px}button{background:#2458b8;color:white;border:0;cursor:pointer}button.reject{background:#8b3440}button:disabled{opacity:.5}article{border:1px solid #dce2eb;padding:16px;border-radius:12px;margin:12px 0}pre{white-space:pre-wrap;direction:ltr;text-align:left;background:#eef2f8;padding:12px;border-radius:8px;overflow-wrap:anywhere}.muted{color:#647087;font-size:13px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main>
<h2>پنل بررسی انتقال دستگاه زروان</h2><p class="muted">فقط اپراتورهای فعال در فهرست مجاز می‌توانند درخواست‌ها را ببینند یا بررسی کنند. هر تصمیم نیازمند ثبت دلیل است.</p>
<label>Supabase Publishable Key</label><input id="pub" placeholder="sb_publishable_...">
<button id="connect">اتصال با حساب مدیر</button><button id="refresh" disabled>بارگذاری درخواست‌های قابل بررسی</button>
<div id="requests"></div><pre id="out">ابتدا با حساب مدیر وارد شوید.</pre></main><script>
const url="https://yztithydgdvydaktuxlw.supabase.co",el=id=>document.getElementById(id);let sb=null,session=null;
async function call(body){const r=await fetch(url+"/functions/v1/admin-device-transfers",{method:"POST",headers:{"content-type":"application/json","apikey":el("pub").value.trim(),"authorization":"Bearer "+session.access_token},body:JSON.stringify(body)});return {http_status:r.status,...await r.json()};}
el("connect").onclick=async()=>{try{sb=window.supabase.createClient(url,el("pub").value.trim(),{auth:{flowType:"pkce",persistSession:true,detectSessionInUrl:true}});const {data,error}=await sb.auth.getSession();if(error||!data.session)throw Error("نشست مدیر پیدا نشد؛ ابتدا با حساب مدیر وارد شوید.");session=data.session;const {data:u,error:ue}=await sb.auth.getUser();if(ue||!u.user)throw Error("نشست نامعتبر");const r=await call({action:"list"});el("out").textContent=JSON.stringify(r,null,2);if(r.http_status===200){el("refresh").disabled=false;render(r.requests||[])} }catch(e){el("out").textContent=String(e)}};
el("refresh").onclick=async()=>{const r=await call({action:"list"});el("out").textContent=JSON.stringify(r,null,2);if(r.http_status===200)render(r.requests||[])};
function render(items){el("requests").replaceChildren();if(!items.length){el("requests").textContent="درخواست قابل بررسی وجود ندارد.";return;}for(const x of items){const a=document.createElement("article"),title=document.createElement("h3"),meta=document.createElement("pre"),reason=document.createElement("textarea"),approve=document.createElement("button"),reject=document.createElement("button");title.textContent=x.id;meta.textContent=JSON.stringify({account_id:x.account_id,reason:x.reason,platform:x.platform,created_at:x.created_at,proof_verified_at:x.proof_verified_at,review_expires_at:x.review_expires_at,key_fingerprint:x.new_key_fingerprint},null,2);reason.placeholder="دلیل بررسی و احراز مستقل مالکیت (حداقل ۸ نویسه)";approve.textContent="تأیید انتقال";reject.textContent="رد درخواست";reject.className="reject";approve.onclick=()=>review(x.id,"approve",reason.value);reject.onclick=()=>review(x.id,"reject",reason.value);a.append(title,meta,reason,approve,reject);el("requests").append(a);}}
async function review(id,decision,reason){if(reason.trim().length<8){el("out").textContent="دلیل بررسی باید حداقل ۸ نویسه باشد.";return;}if(!confirm(decision==="approve"?"با تأیید، دستگاه قبلی ابطال و دستگاه جدید فعال می‌شود. ادامه می‌دهید؟":"درخواست انتقال رد شود؟"))return;const r=await call({action:"review",request_id:id,decision,reason});el("out").textContent=JSON.stringify(r,null,2);if(r.http_status===200)el("refresh").click();}
</script></body></html>
